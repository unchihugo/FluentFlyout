name: .NET format

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  dotnet-format:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Format
      shell: pwsh
      run: |
        dotnet format --verify-no-changes --verbosity diagnostic 2>&1 | Tee-Object -FilePath format-output.log
        if ($LASTEXITCODE -ne 0) {
          $log = (Get-Content format-output.log -Raw) -replace "`r?`n", " || "
          if ($log.Length -gt 60000) { $log = "..." + $log.Substring($log.Length - 60000) }
          Write-Host "::error file=.github/workflows/dotnet-format.yml,line=1::DOTNET-FORMAT-LOG: $log"
          exit 1
        }
