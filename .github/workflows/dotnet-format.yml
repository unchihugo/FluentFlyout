name: .NET format

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  dotnet-format:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Format
      id: fmt
      shell: pwsh
      run: |
        dotnet format --verify-no-changes --verbosity diagnostic 2>&1 | Tee-Object -FilePath format-output.log
        exit $LASTEXITCODE
    - name: Post format log to PR
      if: ${{ failure() }}
      shell: pwsh
      run: |
        if (-not (Test-Path format-output.log)) { $body = "format-output.log missing (restore or earlier step failed)" }
        else { $body = Get-Content format-output.log -Raw }
        if ($body.Length -gt 50000) { $body = $body.Substring(0, 50000) }
        $comment = "dotnet format output (debug, will be removed):`n```````````````text`n${body}`n```````````````"
        gh pr comment ${{ github.event.pull_request.number }} --body $comment --edit-last
        if ($LASTEXITCODE -ne 0) { Write-Error "failed to post comment" }
