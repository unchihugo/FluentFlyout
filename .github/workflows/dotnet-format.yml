name: .NET format

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  actions: write

jobs:
  dotnet-format:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Format
      shell: pwsh
      run: |
        dotnet format --verify-no-changes --verbosity diagnostic 2>&1 | Tee-Object -FilePath format-output.log
        exit $LASTEXITCODE
    - name: Upload format log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: format-log
        path: format-output.log
        if-no-files-found: ignore
